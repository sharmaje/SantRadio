<head>

    <title>Dr Neel Kanth - My Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #fff; color: #0c0c1e; display: flex; min-height: 100vh; }
        
        .bottom { width: 250px; background: rgba(15, 15, 35, 0.9); border-right: 1px solid rgba(255,255,255,0.1); padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #1db954; }

        .nav-links a { color: #b3b3b3; text-decoration: none; font-size: 16px; display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 8px; }
        .nav-links a.active { color: #fff; background: rgba(29, 185, 84, 0.2); border-left: 4px solid #1db954; }

        .main-content { flex: 1; padding: 40px; }
        .profile-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 30px; border-radius: 16px; display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #1db954; object-fit: cover; }
        .profile-details h2 { font-size: 28px; margin-bottom: 5px; }
        .profile-details p { color: #b3b3b3; font-size: 14px; }
        
        .stats-container { display: flex; gap: 20px; margin-top: 20px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box h4 { font-size: 22px; color: #1db954; }
        .stat-box p { font-size: 12px; color: #b3b3b3; margin-top: 5px; }
    </style>
</head>
