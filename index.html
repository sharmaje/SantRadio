<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sant NenuRam Online Radio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--[if lte IE 8]><script src="assets/js/html5shiv.js"></script><![endif]-->
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    
    <style>
        body { text-align: center; font-family: 'Calibri', sans-serif; }
        .custom-player-wrapper {
            background: linear-gradient(135deg, #ff8300, #ffcc00);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            margin: 20px auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .player-info-box {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
        }
        .player-info-box h3 {
            margin: 0 0 8px 0;
            font-size: 19px;
            color: #ffe066;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .player-info-box p {
            margin: 4px 0;
            font-size: 14px;
            color: #e0e0e0;
        }
        .audio-element {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .controls-box {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .ctrl-btn {
            background: #ffaa00;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            transition: all 0.3s ease;
        }
        .ctrl-btn:hover {
            background: #e69500;
            transform: translateY(-1px);
        }
        .counter-box {
            background: #fdfaf0;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            border: 1px solid #d4af37;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Sant NenuRam Online Radio</h2>

    <div class="custom-player-wrapper">
        <div class="player-info-box">
            <h3 id="bhajan-title">Bhajan Load Ho Raha Hain...</h3>
            <p><strong>Album:</strong> <span id="album-name">--</span></p>
            <p><strong>Developed by:</strong> <span id="developed-by">--</span></p>
        </div>
        
        <audio class="audio-element" id="audio-player" controls controlsList="nodownload"></audio>

        <div class="controls-box">
            <!-- ID fixed here to 'prev-btn' -->
            <button class="ctrl-btn" id="prev-btn">⏮ Previous</button>
            <button class="ctrl-btn" id="next-btn">Next ⏭</button>
        </div>
    </div>

    <!-- Counter Section -->
    <div class="counter-box">
        <span style="color: #2ecc71; font-size: 18px;">●</span> 
        <span style="font-weight: bold; color: #333;">Online: 
            <script type="text/javascript" src="https://www.free-counters.org/count/as9d"></script>
        </span>
    </div>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7712932441721616"
     crossorigin="anonymous"></script>
<ins class="adsbygoogle"
     style="display:block"
     data-ad-format="autorelaxed"
     data-ad-client="ca-pub-7712932441721616"
     data-ad-slot="3233616698"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

    <img border="0" src="santbannr.jpg" width="500" height="150" alt="Banner">
    <br>
    <font face="Calibri">Maintained by: <u><b>Sant NenuRam Aashram</b></u></font>
    
    <div style="text-align: center; margin-top: 10px;">
        <div style="background: #333; color: #fff; display: inline-block; padding: 5px 15px; border-radius: 5px; font-weight: bold;">
            <a href="https://www.hitwebcounter.com" target="_blank" style="color: white; text-decoration: none;">VISITOR COUNTER</a>
            <p style="font-size: 11px; color: #ccc; margin: 5px 0 0 0;">Total Blessed Listeners</p>
        </div>
    </div>

    <script>
        const csvUrl = 'SxVxNdb.csv'; 
        let playlist = [];
        let currentTrackIndex = 0;

        const audioPlayer = document.getElementById('audio-player');
        const bhajanTitle = document.getElementById('bhajan-title');
        const albumName = document.getElementById('album-name');
        const developedBy = document.getElementById('developed-by');

        async function loadPlaylist() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n');
                
                playlist = [];
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].trim() === '') continue;
                    const cols = rows[i].split(',');
                    if (cols.length >= 4) {
                        playlist.push({
                            title: cols[0].trim(),
                            playLink: cols[1].trim(),
                            album: cols[2].trim(),
                            developer: cols[3].trim()
                        });
                    }
                }

                if (playlist.length > 0) {
                    currentTrackIndex = Math.floor(Math.random() * playlist.length);
                    playTrack(currentTrackIndex);
                } else {
                    bhajanTitle.innerText = "No Bhajans Found!";
                }
            } catch (error) {
                console.error("Error loading CSV:", error);
                bhajanTitle.innerText = "Error loading playlist.";
            }
        }

        function playTrack(index) {
            if (playlist.length === 0) return;
            const track = playlist[index];
            
            bhajanTitle.innerText = track.title;
            albumName.innerText = track.album;
            developedBy.innerText = track.developer;
            
            audioPlayer.src = track.playLink;
            audioPlayer.load();
            
            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay blocked. Please click play manually.");
                });
            }
        }

        audioPlayer.onended = function() {
            nextTrack();
        };

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentTrackIndex);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            nextTrack();
        });

        function nextTrack() {
            // Random track selection
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * playlist.length);
            } while (nextIndex === currentTrackIndex && playlist.length > 1);
            
            currentTrackIndex = nextIndex;
            playTrack(currentTrackIndex);
        }

        loadPlaylist();
    </script>

     crossorigin="anonymous"></script>

</body>
</html>
