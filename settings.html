<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox - Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0c0c1e; color: #fff; display: flex; min-height: 100vh; }
        
        .sidebar { width: 250px; background: rgba(15, 15, 35, 0.9); border-right: 1px solid rgba(255,255,255,0.1); padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #1db954; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .nav-links a { color: #b3b3b3; text-decoration: none; font-size: 16px; display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 8px; }
        .nav-links a.active { color: #fff; background: rgba(29, 185, 84, 0.2); border-left: 4px solid #1db954; }

        .main-content { flex: 1; padding: 40px; }
        .settings-pane { max-width: 600px; background: rgba(255,255,255,0.03); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .setting-row:last-child { border-bottom: none; }
        .setting-info h3 { font-size: 16px; margin-bottom: 4px; }
        .setting-info p { font-size: 12px; color: #b3b3b3; }
        
        /* Toggle Switch UI */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 24px; }
        .slider-toggle:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-toggle { background-color: #1db954; }
        input:checked + .slider-toggle:before { transform: translateX(22px); }
        
        .save-btn { background: #1db954; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 25px; transition: 0.3s; width: 100%; }
        .save-btn:hover { background: #199e47; transform: translateY(-2px); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">🎵 JUKEBOX</div>
        <ul class="nav-links">
            <li><a href="http://santnenuram.org/">🏠 Home</a></li>
            <li><a href="jukebox.html">📻Jukebox</a></li>
            <li><a href="profile.html">👤 My Profile</a></li>
            <li><a href="settings.html" class="active">⚙️ Settings</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h1 style="margin-bottom: 25px;">App Settings</h1>
        <div class="settings-pane">
            <div class="setting-row">
                <div class="setting-info">
                    <h3>High Quality Audio</h3>
                    <p>Stream in 320kbps extreme fidelity (Requires more data)</p>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider-toggle"></span>
                </label>
            </div>
            
            <div class="setting-row">
                <div class="setting-info">
                    <h3>Dark Mode Active</h3>
                    <p>Toggle high-contrast midnight UI profile</p>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider-toggle"></span>
                </label>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <h3>Autoplay Next Track</h3>
                    <p>Automatically queue upcoming songs from Jukebox</p>
                </div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider-toggle"></span>
                </label>
            </div>

            <button class="save-btn" onclick="alert('Settings Saved Successfully!')">Save Configurations</button>
        </div>
    </main>

</body>
</html>
